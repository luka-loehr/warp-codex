name: Build & Release WarpCodex (macOS arm64)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (leave empty to build artifact only)"
        required: false
        default: "v0.1.1"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "10.14"

jobs:
  macos-arm64:
    name: Build WarpCodex.app & DMG (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure Git LFS models are materialized
        run: |
          git lfs install
          git lfs pull

      - name: Install macOS build dependencies
        run: |
          brew install jq pkgconf llvm protobuf create-dmg
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Install pinned Rust toolchain
        run: |
          TOOLCHAIN="$(grep '^channel' rust-toolchain.toml | head -n1 | cut -d'"' -f2)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy
          rustup default "$TOOLCHAIN"
          rustup target add aarch64-apple-darwin

      - name: Restore Cargo registry and build cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/bin/cargo-bundle
            target/
          key: macos-15-aarch64-warpcodex-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            macos-15-aarch64-warpcodex-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            macos-15-aarch64-warpcodex-

      - name: Prune debug and bundle artifacts to free runner disk
        run: |
          rm -rf target/debug target/*/debug target/release-lto/bundle target/*/release-lto/bundle
          rm -rf target/*/release-lto/deps/*warp* target/*/release-lto/*.dSYM target/release-lto/deps/*warp*
          df -h /

      - name: Install cargo-bundle 0.11.0
        run: |
          if ! cargo bundle --version 2>/dev/null | grep -q "0.11.0"; then
            cargo install cargo-bundle --version 0.11.0 --locked
          fi

      - name: Compile warp-oss release binary
        run: |
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
          export MACOSX_DEPLOYMENT_TARGET="10.14"
          (cd app && cargo build --profile release-lto --bin warp-oss --target aarch64-apple-darwin --features "release_bundle,extern_plist,gui,nld_classifier_v3,nld_heuristic_v2")

      - name: Bundle WarpCodex.app & WarpCodex.dmg
        run: |
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
          NO_LICENSES=1 ./script/bundle --channel oss --arch aarch64 --selfsign
          ls -lh target/release-lto/bundle/osx/

      - name: Smoke-test and stage release artifacts
        run: |
          APP_PATH="target/release-lto/bundle/osx/WarpCodex.app"
          test -d "$APP_PATH"
          test -x "$APP_PATH/Contents/MacOS/warp-oss"
          plutil -lint "$APP_PATH/Contents/Info.plist"
          "$APP_PATH/Contents/MacOS/warp-oss" --help | head -n 30
          mkdir -p /tmp/warpcodex-dist
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" /tmp/warpcodex-dist/WarpCodex-macos-arm64.app.zip
          cp target/release-lto/bundle/osx/WarpCodex.dmg /tmp/warpcodex-dist/WarpCodex-macos-arm64.dmg
          (cd /tmp/warpcodex-dist && shasum -a 256 WarpCodex-macos-arm64.dmg WarpCodex-macos-arm64.app.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          rm -rf target/debug target/*/debug target/release-lto/bundle target/*/release-lto/bundle
          rm -rf target/*/release-lto/deps/*warp* target/*/release-lto/*.dSYM
          df -h /

      - name: Save Cargo build cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/bin/cargo-bundle
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WarpCodex-macos-arm64
          path: |
            /tmp/warpcodex-dist/WarpCodex-macos-arm64.dmg
            /tmp/warpcodex-dist/WarpCodex-macos-arm64.app.zip
            /tmp/warpcodex-dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              /tmp/warpcodex-dist/WarpCodex-macos-arm64.dmg \
              /tmp/warpcodex-dist/WarpCodex-macos-arm64.app.zip \
              /tmp/warpcodex-dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" \
              /tmp/warpcodex-dist/WarpCodex-macos-arm64.dmg \
              /tmp/warpcodex-dist/WarpCodex-macos-arm64.app.zip \
              /tmp/warpcodex-dist/SHA256SUMS.txt \
              --title "WarpCodex $TAG" \
              --notes "Local-first macOS Apple Silicon build of WarpCodex backed by your local Codex CLI (codex app-server). Zero telemetry, zero Warp cloud."
          fi
